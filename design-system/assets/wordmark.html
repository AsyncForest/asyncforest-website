<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Async Forest — Wordmark</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--surface-page); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: 48px; align-items: center; padding: 48px; }
  /* NOTE: no logo was supplied. This wordmark-in-type is the placeholder mark. */
  .wm { display: inline-flex; align-items: baseline; gap: 12px; }
  .wm .name { font-family: var(--font-sans); font-weight: 600; font-size: 40px; letter-spacing: var(--tracking-tight); color: var(--text-strong); }
  .wm .name .async { color: var(--gray-500); }
  .wm .desc { font-family: var(--font-mono); font-size: 11px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-muted); }
  .on-dark { background: var(--surface-dark); padding: 28px 40px; border-radius: var(--radius-lg); }
  .on-dark .name { color: var(--gray-50); }
  .on-dark .name .async { color: var(--gray-400); }
  .on-dark .desc { color: var(--gray-400); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray-500); display: inline-block; margin: 0 2px 2px 0; }
</style>
</head>
<body>
  <div class="stack">
    <div class="wm"><span class="name"><span class="async">Async</span> Forest</span><span class="desc">Advisory</span></div>
    <div class="wm on-dark"><span class="name"><span class="async">Async</span> Forest</span><span class="desc">Advisory</span></div>
  </div>
</body>
</html>
