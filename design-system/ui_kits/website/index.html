  /* Lucide icon helper, shared with screen modules via window.AFIco */
  window.AFIco = function Ico({ n, s = 18 }) {
    const ref = React.useRef();
    React.useEffect(() => {
      if (!ref.current) return;
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', n);
      ref.current.appendChild(el);
      if (window.lucide) window.lucide.createIcons({ attrs: { width: s, height: s, 'stroke-width': 1.75 }, nameAttr: 'data-lucide' });

    return React.createElement('span', { ref, style: { display: 'inline-flex', lineHeight: 0 } });
  };

<script type="text/babel">
  const AF_SECTIONS = ['top', 'services', 'process', 'sample', 'contact'];
  function Site() {
    const [active, setActive] = React.useState('top');
    const scrollTo = (id) => {
      if (id === 'top') { window.scrollTo({ top: 0 }); return; }
      const el = document.getElementById(id);
      if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 76; window.scrollTo({ top: y }); }
    };
    React.useEffect(() => {
      const targets = ['.af-hero', '#services', '#process', '#sample', '#contact']
        .map(s => document.querySelector(s)).filter(Boolean);
      // Scrollspy: mark the section nearest the top of the viewport as active
      const onScroll = () => {
        const y = window.scrollY + 90;
        let cur = 'top';
        targets.forEach(el => {
          const id = el.id || 'top';
          if (el.getBoundingClientRect().top + window.scrollY <= y) cur = id;
        });
        setActive(cur);
      };
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
      // Staggered reveal — opt in only when motion is welcome
      let io;
      if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
        document.body.classList.add('af-reveal');
        targets.forEach(el => el.setAttribute('data-reveal', ''));
        io = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('af-in'); io.unobserve(e.target); } });
        }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });
        targets.forEach(el => io.observe(el));
      }
      return () => { window.removeEventListener('scroll', onScroll); if (io) io.disconnect(); };
    }, []);
    return (
      <div>
        <window.AFHeader onNav={scrollTo} active={active} />
        <main id="main">
          <window.AFHero onNav={scrollTo} />
          <window.AFServices />
          <window.AFProcess />
          <window.AFSample />
          <window.AFContact />
        </main>
        <window.AFFooter onNav={scrollTo} />
      </div>
    );
  }
  function mount() {
    if (!window.AFHeader || !window.AFFooter || !window.AsyncForestDesignSystem_6656fd) { setTimeout(mount, 60); return; }
    ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
  }
  mount();
</script>
