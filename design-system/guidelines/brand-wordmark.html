<!-- @dsCard group="Brand" viewport="700x200" name="Wordmark" subtitle="Type-set placeholder — no logo supplied" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; display: flex; }
  .cell { flex: 1; display: grid; place-items: center; padding: 34px; }
  .light { background: var(--surface-card); }
  .dark { background: var(--surface-dark); }
  .wm { display: inline-flex; align-items: baseline; gap: 11px; }
  .name { font-family: var(--font-sans); font-weight: 600; font-size: 34px; letter-spacing: var(--tracking-tight); color: var(--text-strong); }
  .async { color: var(--gray-500); }
  .desc { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-muted); }
  .dark .name { color: var(--gray-50); }
  .dark .async { color: var(--gray-400); }
  .dark .desc { color: var(--gray-400); }
</style>
</head>
<body>
  <div class="cell light"><div class="wm"><span class="name"><span class="async">Async</span> Forest</span><span class="desc">Advisory</span></div></div>
  <div class="cell dark"><div class="wm"><span class="name"><span class="async">Async</span> Forest</span><span class="desc">Advisory</span></div></div>
</body>
</html>
