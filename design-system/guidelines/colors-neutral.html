<!-- @dsCard group="Colors" viewport="700x150" name="Neutral scale" subtitle="Supplied cool-crisp grays — text, borders, chrome" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); }
  .row { display: flex; gap: 0; padding: 20px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: 8px; border: 1px solid var(--border-subtle); }
  .name { font-size: 10px; color: var(--text-strong); margin-top: 8px; letter-spacing: .02em; }
  .hex { font-size: 9px; color: var(--text-subtle); margin-top: 2px; }
  .sw + .sw { padding-left: 8px; }
</style>
</head>
<body>
  <div class="row" id="row"></div>
  <script>
    const shades = [50,100,200,300,400,500,600,700,800,900,950];
    document.getElementById('row').innerHTML = shades.map(s => {
      const v = getComputedStyle(document.documentElement).getPropertyValue('--gray-'+s).trim();
      return `<div class="sw"><div class="chip" style="background:${v}"></div><div class="name">${s}</div><div class="hex">${v}</div></div>`;
    }).join('');
  </script>
</body>
</html>
