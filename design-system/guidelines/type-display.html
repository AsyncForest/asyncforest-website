<!-- @dsCard group="Type" viewport="700x180" name="Display — Hanken Grotesk" subtitle="Sans display. Weight + tight tracking carry headings — no serif" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 28px 32px; }
  .eyebrow { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-muted); }
  h1 { font-family: var(--font-sans); font-weight: 600; font-size: var(--text-4xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--text-strong); margin: 10px 0 6px; }
  .meta { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="eyebrow">Display</div>
  <h1>Stands behind the answer.</h1>
  <div class="meta">Hanken Grotesk · 600 · tracking −0.015em · line-height 1.08</div>
</body>
</html>
