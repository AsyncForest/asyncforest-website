<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base grid — generous, calm rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 24px 32px; font-family: var(--font-mono); }
  .r { display: flex; align-items: center; gap: 14px; padding: 5px 0; }
  .bar { height: 14px; background: var(--gray-700); border-radius: 3px; }
  .lab { font-size: 10px; color: var(--text-muted); width: 96px; }
</style>
</head>
<body>
  <div class="r"><span class="lab">2 · 8px</span><span class="bar" style="width:8px"></span></div>
  <div class="r"><span class="lab">4 · 16px</span><span class="bar" style="width:16px"></span></div>
  <div class="r"><span class="lab">6 · 24px</span><span class="bar" style="width:24px"></span></div>
  <div class="r"><span class="lab">8 · 32px</span><span class="bar" style="width:32px"></span></div>
  <div class="r"><span class="lab">12 · 48px</span><span class="bar" style="width:48px"></span></div>
  <div class="r"><span class="lab">16 · 64px</span><span class="bar" style="width:64px"></span></div>
</body>
</html>
