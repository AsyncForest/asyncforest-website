<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="One sans family; size + weight build the hierarchy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px 32px; }
  .r { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--border-subtle); padding: 9px 0; }
  .r:last-child { border-bottom: 0; }
  .s { font-family: var(--font-sans); color: var(--text-strong); letter-spacing: var(--tracking-tight); line-height: 1; white-space: nowrap; }
  .t { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); margin-left: auto; }
</style>
</head>
<body>
  <div class="r"><span class="s" style="font-size:var(--text-4xl);font-weight:600">Advisory</span><span class="t">4xl · 60 · 600</span></div>
  <div class="r"><span class="s" style="font-size:var(--text-3xl);font-weight:600">Advisory</span><span class="t">3xl · 48 · 600</span></div>
  <div class="r"><span class="s" style="font-size:var(--text-2xl);font-weight:600">Advisory</span><span class="t">2xl · 36 · 600</span></div>
  <div class="r"><span class="s" style="font-size:var(--text-xl);font-weight:500">Advisory</span><span class="t">xl · 28 · 500</span></div>
  <div class="r"><span class="s" style="font-size:var(--text-lg);font-weight:500">Advisory</span><span class="t">lg · 22 · 500</span></div>
  <div class="r"><span class="s" style="font-size:var(--text-base);font-weight:400">Advisory (body)</span><span class="t">base · 16 · 400</span></div>
</body>
</html>
