<!-- @dsCard group="Brand" viewport="700x230" name="Voice" subtitle="Warm, crisp, credible. Sentence case. 'You' + 'I'. No emoji." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-warm); padding: 26px 32px; }
  .eyebrow { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--gray-800); }
  .head { font-family: var(--font-sans); font-weight: 600; font-size: var(--text-xl); line-height: var(--leading-snug); letter-spacing: var(--tracking-tight); color: var(--text-strong); margin: 8px 0 6px; max-width: 34ch; }
  .head .u { box-shadow: inset 0 -0.14em 0 var(--gray-900); }
  .sub { font-family: var(--font-sans); font-size: var(--text-base); line-height: var(--leading-relaxed); color: var(--text-body); max-width: 56ch; margin: 0; }
</style>
</head>
<body>
  <div class="eyebrow">Independent technical assurance</div>
  <div class="head">An expert who verifies it themselves — and <span class="u">stands behind the answer.</span></div>
  <p class="sub">Point-in-time, scope-limited reports with prioritised, actionable fixes. Technical observations, not legal advice.</p>
</body>
</html>
