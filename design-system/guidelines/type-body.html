<!-- @dsCard group="Type" viewport="700x200" name="Body — Hanken Grotesk" subtitle="Humanist sans for body & UI — clean, friendly, legible" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 24px 32px; }
  .eyebrow { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  p { font-family: var(--font-sans); font-size: var(--text-md); line-height: var(--leading-relaxed); color: var(--text-body); margin: 0 0 8px; max-width: 62ch; }
  .meta { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-subtle); margin-top: 10px; }
</style>
</head>
<body>
  <div class="eyebrow">Body</div>
  <p>Independent, accountable technical assurance: a qualified expert who does their own verification. You'll know what was in scope, what I found, and what to fix first.</p>
  <div class="meta">Hanken Grotesk · 400/500/600 · line-height 1.65</div>
</body>
</html>
