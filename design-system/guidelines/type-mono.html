<!-- @dsCard group="Type" viewport="700x150" name="Mono — JetBrains Mono" subtitle="Eyebrows, labels, tags, code — the engineer's fingerprint" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 24px 32px; font-family: var(--font-mono); }
  .eyebrow { font-size: var(--text-2xs); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--gray-900); }
  .label { font-size: var(--text-sm); color: var(--text-strong); margin-top: 12px; }
  .code { font-size: var(--text-sm); color: var(--text-muted); background: var(--surface-sunken); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 6px 10px; display: inline-block; margin-top: 12px; }
</style>
</head>
<body>
  <div class="eyebrow">Independent Technical Assurance</div>
  <div class="label">Scope · Findings · Priority</div>
  <div class="code">--tracking-eyebrow: 0.14em</div>
</body>
</html>
