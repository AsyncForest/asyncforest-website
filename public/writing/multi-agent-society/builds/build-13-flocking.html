<style>/* spider-kit — design tokens
   Isometric low-poly / voxel-pixel lecture visuals with hand-drawn annotation overlays.
   Type is resolved from installed faces only (local() sources, no network), so single-file
   embeds stay self-contained. */

/* Locally-installed faces, declared so the token families resolve without a request.
   If a machine lacks one, the token's fallback stack renders instead. */
@font-face{font-family:'Optima';src:local('Optima'),local('Optima Regular'),local('Gill Sans MT'),local('Trebuchet MS');font-weight:400;font-display:swap}
@font-face{font-family:'Optima';src:local('Optima Bold'),local('Gill Sans MT Bold'),local('Trebuchet MS Bold');font-weight:700;font-display:swap}
@font-face{font-family:'Avenir Next';src:local('Avenir Next'),local('AvenirNext-Regular'),local('Avenir'),local('Segoe UI');font-weight:400;font-display:swap}
@font-face{font-family:'Avenir Next';src:local('Avenir Next Demi Bold'),local('AvenirNext-DemiBold'),local('Avenir Heavy'),local('Segoe UI Semibold');font-weight:600;font-display:swap}
@font-face{font-family:'Bradley Hand';src:local('Bradley Hand'),local('BradleyHandITCTT-Bold'),local('Chalkboard SE'),local('Segoe Print');font-weight:400;font-display:swap}

:root{
  /* ---- palette (14 colours, hard cap) ---- */
  --sk-ink:#2b2620;            /* annotation charcoal, outlines, spider */
  --sk-paper:#f5ecdb;          /* warm parchment ground */
  --sk-panel:#e6d8bf;          /* flat panels, empty grid tiles */
  --sk-grass:#94a95c;
  --sk-grass-deep:#61793f;
  --sk-rock:#8e8578;
  --sk-sand:#dcc08d;
  --sk-water:#6a93a6;
  --sk-reward:#4e9a5b;         /* semantic: success / correct path */
  --sk-fail:#c0563f;           /* semantic: dead end / wrong */
  --sk-fog:#a9a39a;            /* semantic: unknown region */
  --sk-highlight:#e3a337;      /* semantic: attention */
  --sk-violet:#7b6aa6;         /* arc accent */
  --sk-void:#171310;           /* the black model box */

  /* one accent per lecture arc — alias, never a new hue */
  --sk-accent-arc-1:var(--sk-highlight);
  --sk-accent-arc-2:var(--sk-violet);
  --sk-accent-arc-3:var(--sk-water);

  /* ---- type ---- */
  --sk-font-display:Optima,"Gill Sans MT","Gill Sans","Trebuchet MS","Segoe UI",sans-serif;
  --sk-font-body:"Avenir Next",Avenir,"Segoe UI","Helvetica Neue",Helvetica,sans-serif;
  --sk-font-annot:"Bradley Hand","Chalkboard SE","Segoe Print","Comic Sans MS",cursive;

  /* sizes are authored against the 1920×1080 stage; the stage scales as one unit */
  --sk-display:72px;
  --sk-display-sm:48px;
  --sk-body:30px;
  --sk-annot:34px;
  --sk-label:20px;             /* caps, letter-spaced pins & keys */
  --sk-leading-tight:1.08;
  --sk-leading-body:1.38;
  --sk-tracking-label:0.14em;

  /* ---- motion ----
     Durations live in JS as SK.DUR (quick 240 / normal 600 / slow 1200 / morph 1800,
     stagger 60 — all ms), which is the single source of truth every animation call reads.
     CSS gets the curves; write the ms literal inline when a CSS transition needs one. */
  --sk-ease-gentle:cubic-bezier(.65,0,.35,1) /* @kind other */;
  --sk-ease-out:cubic-bezier(.22,1,.36,1) /* @kind other */;

  /* ---- geometry ---- */
  --sk-radius-sm:8px;
  --sk-radius:18px;
  --sk-radius-lg:32px;
  --sk-rule:2px;
  --sk-stage-w:1920px;
  --sk-stage-h:1080px;
}

/* ---- stage ---- */
.sk-fit{margin:0;background:var(--sk-ink);overflow:hidden}
.sk-stage-fit{position:fixed;inset:0;overflow:hidden}
.sk-stage{position:absolute;left:50%;top:50%;width:var(--sk-stage-w);height:var(--sk-stage-h);background:var(--sk-paper);transform-origin:50% 50%;overflow:hidden;font-family:var(--sk-font-body);color:var(--sk-ink)}
.sk-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---- DOM chrome (never captured) ---- */
.sk-chrome{position:absolute;font-family:var(--sk-font-body);color:var(--sk-ink)}
.sk-counter{right:34px;bottom:26px;display:flex;align-items:baseline;gap:14px;opacity:.5;font-size:var(--sk-label);letter-spacing:var(--sk-tracking-label);text-transform:uppercase}
.sk-counter b{font-weight:600}
.sk-counter span{font-family:var(--sk-font-annot);text-transform:none;letter-spacing:0;font-size:26px;opacity:.85}

/* ---- slide copy ---- */
.sk-copy{position:absolute;max-width:1180px}
.sk-display{font-family:var(--sk-font-display);font-size:var(--sk-display);line-height:var(--sk-leading-tight);letter-spacing:-.012em;margin:0;text-wrap:pretty}
.sk-display-sm{font-size:var(--sk-display-sm)}
.sk-body{font-family:var(--sk-font-body);font-size:var(--sk-body);line-height:var(--sk-leading-body);margin:.5em 0 0;max-width:26em;text-wrap:pretty}
.sk-annot{font-family:var(--sk-font-annot);font-size:var(--sk-annot);line-height:1.2}
.sk-label{font-family:var(--sk-font-body);font-size:var(--sk-label);text-transform:uppercase;letter-spacing:var(--sk-tracking-label);font-weight:600}

a{color:var(--sk-ink);text-decoration-thickness:2px;text-underline-offset:3px}
a:hover{color:var(--sk-grass-deep)}

@media (prefers-reduced-motion:reduce){
  .sk-stage *,.sk-stage{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}
}
</style>
<style>/* ============================================================================
   af-spider-theme.css — Async Forest  ⊳  spider-kit
   The one reconciliation layer for the whole lecture. Async Forest supplies the
   fonts, the colours and the aesthetic; spider-kit keeps its structure, its step
   engine and its guardrails. Nothing here forks kit CSS: this file only
   redefines spider-kit's custom properties and re-faces its copy/chrome classes.

   LOAD ORDER (hard requirement — every build inlines all three, in this order):
     1  assets/fonts/fonts.css        Hanken Grotesk + JetBrains Mono, data-URI
     2  design-assets/Presentations/spider-kit.css
     3  theme/af-spider-theme.css     ← this file

   spider-kit paints its canvases by reading these custom properties at first
   use (sk-core `cssVar()`), so the terrain, the actors, the paths, the model box
   and the annotation marks all re-skin from the tokens below. The one hue the
   kit bakes into JS is handled at the bottom of this file and in THEME.md.

   Rules of the road: sentence case, no emoji, calm motion, one accent.
   The decisions and the do/don't list live in theme/THEME.md — read it first.
   ========================================================================== */

:root{

  /* ==========================================================================
     1. PALETTE — 14 named slots, hard cap (spider-kit law), re-hued into Async
        Forest's cool-gray monochrome world. 13 distinct hues; the 14th slot is
        deliberately unspent (violet is aliased to the accent) so no sequence can
        ever show two accents. Every other tone in the kit is derived from these
        by mix()/shade()/alpha() — never add a fifteenth.
     ====================================================================== */

  /* --- ink · paper · panel · void: the page -------------------------------- */
  --sk-ink:#14161a;            /* AF --gray-900 · copy, outlines, annotation, spider */
  --sk-paper:#f4f6fb;          /* AF --gray-100 · the ground the whole stage sits on */
  --sk-panel:#d5dae5;          /* AF --gray-400 · flat grid, plaques, empty tiles */
  --sk-void:#060709;           /* AF --gray-950 · the matte model box */

  /* --- terrain: one cool-gray relief ramp ---------------------------------
     Lit shores, mid fields, dark crags — a printed relief map, not a garden.
     Hues sit on Async Forest's neutral axis (~215-220°, low saturation), so the
     map reads as the same material as the type. Steps of ~10 in lightness keep
     five materials apart from the back of a hall. */
  --sk-water:#8aa1bb;          /* the only visibly chromatic terrain tone */
  --sk-sand:#bfc7d6;           /* the lit shoreline band, and the low plain */
  --sk-grass:#a4adbd;          /* the dominant field */
  --sk-grass-deep:#878f9e;     /* uplands */
  --sk-rock:#626a79;           /* crags — the darkest ground */

  /* --- semantic states ----------------------------------------------------- */
  --sk-reward:#347460;         /* AF --forest-500 · functional success only */
  --sk-fail:#c0442e;           /* AF --red-500 (--danger) · functional failure only */
  --sk-fog:#dcdee4;            /* bleached: the map losing its shape back into paper */
  --sk-highlight:#234a8f;      /* AF --accent · THE accent. Rare. One per screen. */

  /* --- slot 14: alias, not a hue ------------------------------------------- */
  --sk-violet:#234a8f;         /* = --sk-highlight. There is no second accent. */

  /* --- arc accents: aliases of the above, never new hues -------------------- */
  --sk-accent-arc-1:#234a8f;   /* deep blue — the default arc accent */
  --sk-accent-arc-2:#14161a;   /* ink — i.e. NO accent: this arc carries emphasis with
                                  weight and position, not hue. Identical to --sk-ink by
                                  design; see THEME.md §2. */
  --sk-accent-arc-3:#8aa1bb;   /* slate (= --sk-water) — when the blue must stay reserved */

  /* --- derived tones the theme itself uses (not palette slots) --------------
     On --sk-void the deep blue measures 2.35:1 — under the 3:1 non-text floor.
     Anything that must read on the model box uses `paper`, or this one derived
     lift of the accent (6.8:1 on void). See THEME.md §6.5. */
  --af-accent-on-dark:#8197c0; /* = mix('highlight','paper',0.45) */
  --af-ring:color-mix(in srgb, var(--sk-ink) 50%, var(--sk-paper)); /* AF --ring, gray-600 */

  /* ==========================================================================
     2. TYPE — two faces, and one rule: canvas text is mono, DOM text is Hanken.
        Async Forest is sans-only, so spider-kit's handwriting face is retired.
        The wobbly hand-drawn MARKS stay (deck protocol D1); their words are set.
        NOTE: --sk-font-body is the face the kit hard-codes for CANVAS labels
        (district plaques, ModelBox titles, `label()`), so it carries the mono.
        DOM body copy is re-pointed to Hanken on .sk-body below. Build agents
        should use --af-font-* in their own CSS, never --sk-font-body.
     ====================================================================== */
  --af-font-display:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --af-font-body:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --af-font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  /* literal stacks (not var() indirection): these strings are read straight into
     canvas ctx.font, so they must resolve without substitution */
  --sk-font-display:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --sk-font-body:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sk-font-annot:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  /* sizes, against the 1920×1080 stage. Nothing authored below 24px. */
  --sk-display:72px;
  --sk-display-sm:46px;
  --sk-body:30px;
  --sk-annot:32px;             /* mono runs wide: 32 reads as the old 34 */
  --sk-label:24px;             /* was 20 — the floor is 24 on stage */
  --sk-leading-tight:1.08;     /* AF --leading-tight */
  --sk-leading-body:1.4;

}

      repainted here rather than by forking the kit. See THEME.md §6.1.

      margin-top:-26px; padding-top:26px`) and centres the wash at `0% 50%` —

   simulation never runs on the clock. It runs ONCE at load, from a fixed seed,
   for a fixed number of integer ticks, and the result is a table of frames.
   `enter()` plays the table over a duration; `settle()` reads its last row.
   Neither path consults performance.now(), Math.random or the frame rate, so
   the settled frame is byte-identical however the deck arrives at it — and the
   last `hold` rows of every table are identical to each other, so even a
   screenshot that lands early cannot catch the flock mid-glide.

   SINCE 6 SEPTEMBER 2026 THERE IS A SECOND, LIVE CONSUMER of this file, added
   at the presenter's request ("make the animations loop"): once a step has
   played its table and held it long enough to be read, scene.js resumes the
   simulation on the clock, from that step's last row, and the flock flies for
   as long as the step is on screen. That loop calls `tick` directly — which is
   why `tick`, `copy` and `CRUISE` are exported now — and it is the ONLY part
   of this build that reads a clock. It cannot disturb the guarantee above:
   `build()` is unchanged to the last float, and the live flight keeps its own
   copy of the state and never writes back into a table. What a capture gets is
   handled by `deck.freezeForCapture()`, which puts the step back on the row
   `settle()` draws and stops the loop; nothing here is timed around a
   screenshot. See "THE FLOCK NEVER LANDS" in scene.js.

   The three rules are applied CUMULATIVELY: each step's trajectory starts from
   the previous step's final state. The audience watches one flock reorganise as
   each rule is switched on, not four unrelated simulations.

   WHY THE SIMULATION RUNS IN STAGE PIXELS, NOT TILES. The stage is the kit's
   isometric grid, and `Landscape.project` maps a tile step of (1,0) to 20.9
   screen px but a tile step of (0.7,0.7) to 18.7 px and (0.7,-0.7) to 37.4 px.
   Separation is a distance rule, so a separation radius in tiles would hold the
   birds twice as far apart along one screen diagonal as the other — the flock
   would read as a lens, not a flock, and at step 4 the parrot sprites would
   collide along the compressed axis while leaving gaps along the other. The
   birds fly at a constant altitude over flat ground, so their screen positions
   are the projection of their shadows offset by one constant (LIFT, derived
   from `land.project` in scene.js). Simulating the shadows in stage pixels is
   therefore the same simulation, in the one metric that governs what the room
   actually sees. The projection is still the kit's: scene.js takes the flight
   offset, the ground plane and the containment diamond from `land.project`,
   and the shadow silhouettes are squashed by the grid's own tile.h/tile.w.

   Loaded by scene.js (spliced in by assemble.js) and require()d by the tuning
   probe, which is how the seed and the weights below were chosen.
   ========================================================================== */
const BOIDS = (function(){
  'use strict';

  /* 24 agents. The brief asks for fewer, larger marks over a cloud of dots. At
     the separation distance below, 24 birds scatter across ~1100 x 520 px and
     flock into a blob ~360 px across — a change big enough to read from the
     back of a hall — while staying far enough apart that 24 parrot sprites
     (about 50 px wide) do not collide when the marks change at step 4. */
  const N = 24;

  /* The stage the flock lives on, in 1920x1080 stage pixels: a diamond
     concentric with the grid, at 88% of the grid's own diagonals, so a bird's
     shadow always lands on a drawn tile and never off the edge of the map.
     Containment is a proportional turn back inside, starting at CONTAIN of the
     way out. It is not one of Reynolds' rules and is on in every step — it is
     the edge of the world, not an argument. */
  const BOX = { cx: 960, cy: 650, rx: 560, ry: 280, contain: 0.92 };

  /* THE CRUISE BOX — a second, smaller edge of the world, used only by the
     live flight loop scene.js runs once a step has settled (added 6 Sep 2026;
     see "THE FLOCK NEVER LANDS" in scene.js). BOX is where the four scripted
     trajectories happen and MUST NOT MOVE: every settled formation, every
     measurement in the header of scene.js and the one surviving annotation
     placement are functions of it.

     WHY A SECOND BOX AT ALL. A flock that flies for as long as the step is on
     screen visits the whole of its box, and the whole of BOX is not free.
     BOX's top vertex is (960, 370); a bird flies LIFT = 83 px above its
     shadow, so that is a bird at y 287, and the slide copy occupies y 76..306.
     Left in BOX the birds fly through the title — measured, 15 minutes of
     flight per step: between 4,100 and 15,300 frames with a bird glyph
     overlapping the copy rectangle, on every one of the four steps.

     WHY AN ELLIPSE AND NOT A DIAMOND. BOX is a diamond, |nx| + |ny|, whose
     normal flips sign across each axis. Over a few hundred ticks that never
     matters; over minutes it does — a bird flying out along one of the axes
     has the wall alternate its answer every tick, cancels its own turn, and
     leaves. (Measured: out = 6.0 and climbing, 1,700 ticks in.) hypot(nx, ny)
     has a smooth normal everywhere.

     MEASURED over 60 minutes of flight per step, from each step's settled
     state, at 60 ticks/s:

       step   highest bird   copy hits   off-grid   nearest pair   R
       0      y 349          0           0.83       0             0.00-0.56
       1      y 371          0           0.88       69            0.00-0.71
       2      y 340          0           1.16       41            0.25-1.00
       3      y 332          0           1.03       35            0.57-0.99

     "copy hits" counts frames in which any bird glyph overlaps the slide
     copy: none, on any step, in an hour. "off-grid" is the worst any SHADOW
     reached, as a fraction of the grid's own projected quad — 1.16 means a
     shadow 16% of the way past the edge of the map for a moment on the
     alignment step, on pale ground where a 0.14-alpha shadow is barely there.
     For scale, the same measurement inside BOX is 1.15, so this is not a
     regression, and the birds themselves have always flown over the edge.

     THE RULES STAY TRUE WHILE THE FLOCK IS ALIVE, which is the gate this box
     had to clear and not just "the birds are on the map". Separation holds
     (closest pair 69 px on step 1, against the 62 px the tuning gate asks of
     the settled frame), alignment still reaches R 1.00, cohesion still holds
     the flock at an extent of 376-514 px against 444 settled, and step 0 —
     which has no rules at all and so is the one that catches a wall imposing
     order of its own — keeps a mean nearest-neighbour distance of 44 px, which
     is what 24 birds scattered at random over this ellipse would give. */
  const CRUISE = { cx: 960, cy: 655, rx: 430, ry: 190,
                   contain: 0.86, w: 3.0, turn: 0.16, into: 0.70 };

  /* Parameters. Distances in stage px, speeds in px/tick, forces in px/tick^2.
     TUNED, NOT GUESSED — the scratchpad probe runs this file across a seed
     sweep and reports, for each step's final frame, the minimum pairwise
     distance (crowding), the mean nearest-neighbour distance (spacing), the
     mean distance to the centroid (how tight the flock is) and the resultant
     length R of the unit heading vectors (R = 1 is perfect alignment). The
     gates each rule has to clear, i.e. the definition of "this rule visibly
     changed the flock":

       step 0  a pair inside 46 px, spread over 250 px, headings scattered
       step 1  no pair inside 62 px, still spread, headings still scattered
       step 2  headings collapse to R > 0.90, spacing and spread unchanged
       step 3  spread collapses below 150 px with spacing and heading intact  */
  const P = {
    maxSpeed : 1.5,
    minSpeed : 0.9,
    maxForce : 0.20,
    sepR     : 86,    // separation: the personal-space radius
    aliR     : 200,   // alignment: deliberately LOCAL — see below
    cohR     : 520,   // cohesion: the rule that has to reach across the stage
    wSep     : 2.60,
    wAli     : 1.15,
    wCoh     : 1.40,
    wBnd     : 3.00,
    seed     : 364   // chosen by the sweep in the header, not by eye
  };

  /* THE THREE RADII ARE NOT THE SAME, AND THAT IS THE ARGUMENT.
     Reynolds' rules are local; giving all three the same generous
     neighbourhood makes alignment do cohesion's work, because once every bird
     can see every other bird they adopt one heading, fly off together and pile
     up against the edge of the world — measured: one shared radius of 270 px
     collapsed the flock's extent from 753 px to 561 px at the ALIGNMENT step,
     leaving cohesion nothing left to show. With alignment kept local (200 px)
     and cohesion given the long reach (340 px) the three beats separate
     cleanly: separation evens the spacing, alignment turns near neighbours into
     parallel streams that still point different ways in different parts of the
     stage, and cohesion is what gathers those streams into one flock. */

  /* Mulberry32 — the kit's own PRNG (sk-core), restated so this file has no
     imports and can be require()d by the probe as well as inlined in the build. */
  function rng(seed){
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
      t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const smoothstep = t => t * t * (3 - 2 * t);

  /* ---- the seeded scatter -------------------------------------------------
     Rejection-sampled uniform over the containment diamond, with a uniform
     heading and a spread of speeds. Deliberately NOT a jittered grid: uniform
     sampling is what produces the near-collisions that step 1 exists to remove,
     and step 1 only reads as a change if step 0 has something to change. */
  function scatter(seed){
    const r = rng(seed);
    const s = { x:new Float64Array(N), y:new Float64Array(N),
                vx:new Float64Array(N), vy:new Float64Array(N) };
    for(let i = 0; i < N; i++){
      let px, py;
      do {
        px = (r() * 2 - 1) * 0.9; py = (r() * 2 - 1) * 0.9;
      } while(Math.abs(px) + Math.abs(py) > 0.9);
      s.x[i] = BOX.cx + px * BOX.rx; s.y[i] = BOX.cy + py * BOX.ry;
      const a = r() * Math.PI * 2, sp = P.minSpeed + r() * (P.maxSpeed - P.minSpeed);
      s.vx[i] = Math.cos(a) * sp; s.vy[i] = Math.sin(a) * sp;
    }
    return s;
  }
  const copy = s => ({ x:s.x.slice(), y:s.y.slice(), vx:s.vx.slice(), vy:s.vy.slice() });

  /* ---- one tick -----------------------------------------------------------
     Classic Reynolds steering: each rule proposes a DESIRED velocity at full
     speed, the steering force is (desired - current) clipped to maxForce, and
     the forces sum. `rules` is a bitmask so the deck switches them on one at a
     time: 1 separation, 2 alignment, 4 cohesion. `env` scales both the
     acceleration and the position update, so setting it to 0 freezes the flock
     exactly, rather than leaving headings rotating over frozen positions.
     `box` is the edge of the world: BOX for the scripted tables (the default,
     so `run` below is bit-for-bit what it always was), CRUISE for the live
     flight loop. */
  function tick(s, rules, env, box){
    const b = box || BOX;
    const ax = new Float64Array(N), ay = new Float64Array(N);
    for(let i = 0; i < N; i++){
      let sepX = 0, sepY = 0, sepN = 0;
      let aliX = 0, aliY = 0, aliN = 0;
      let cohX = 0, cohY = 0, cohN = 0;
      for(let j = 0; j < N; j++){
        if(j === i) continue;
        const dx = s.x[i] - s.x[j], dy = s.y[i] - s.y[j];
        const d = Math.hypot(dx, dy);
        if(d <= 1e-6) continue;
        if(d < P.sepR){ sepX += dx / d / d; sepY += dy / d / d; sepN++; }
        if(d < P.aliR){ aliX += s.vx[j]; aliY += s.vy[j]; aliN++; }
        if(d < P.cohR){ cohX += s.x[j];  cohY += s.y[j];  cohN++; }
      }
      let fx = 0, fy = 0;
      const steer = (dx, dy, w) => {                    // desired direction -> force
        const m = Math.hypot(dx, dy);
        if(m <= 1e-9) return;
        let ex = dx / m * P.maxSpeed - s.vx[i], ey = dy / m * P.maxSpeed - s.vy[i];
        const em = Math.hypot(ex, ey);
        if(em > P.maxForce){ ex = ex / em * P.maxForce; ey = ey / em * P.maxForce; }
        fx += ex * w; fy += ey * w;
      };
      if((rules & 1) && sepN) steer(sepX, sepY, P.wSep);
      if((rules & 2) && aliN) steer(aliX / aliN, aliY / aliN, P.wAli);
      if((rules & 4) && cohN) steer(cohX / cohN - s.x[i], cohY / cohN - s.y[i], P.wCoh);

      /* CONTAINMENT, and the live flight needs more of it than the tables do.
         Both boxes get this proportional steer at the centre of the world; it
         is what all four tables were computed with and it must not change. It
         is also, on its own, wrong for a flight that lasts minutes: aimed at
         the centre, birds with no rules between them (step 0) are all
         eventually pointed at the same point and arrive there together. The
         flock's extent collapsed to 311 px — the step whose whole claim is "no
         plan" grew a flock. So CRUISE carries `turn` as well, and its weight
         `w` here is the flock's leash rather than its wall. See the turning
         wall in the integration loop below. */
      const nx = (s.x[i] - b.cx) / b.rx, ny = (s.y[i] - b.cy) / b.ry;
      const out = b.turn ? Math.hypot(nx, ny) : Math.abs(nx) + Math.abs(ny);
      if(out > b.contain){
        const k = Math.min(1, (out - b.contain) / (1 - b.contain));
        steer(-nx * b.rx, -ny * b.ry, (b.w === undefined ? P.wBnd : b.w) * k);
      }
      ax[i] = fx; ay[i] = fy;
    }
    for(let i = 0; i < N; i++){
      s.vx[i] += ax[i] * env; s.vy[i] += ay[i] * env;
      let sp = Math.hypot(s.vx[i], s.vy[i]);
      if(sp < 1e-9){ s.vx[i] = P.minSpeed; s.vy[i] = 0; sp = P.minSpeed; }
      const cl = sp > P.maxSpeed ? P.maxSpeed / sp : sp < P.minSpeed ? P.minSpeed / sp : 1;
      if(cl !== 1){ s.vx[i] *= cl; s.vy[i] *= cl; }
      /* THE TURNING WALL — the live flight's real edge of the world, and a
         ROTATION rather than a force: while a bird is past the margin and not
         yet heading properly back in, its velocity turns `b.turn` radians a
         tick towards the inside, until its heading is `b.into` of the way in
         from tangential. Then it is left alone and it crosses the stage.

         A rotation does no work. |v| is unchanged to the last float, so the
         speed clamp above never fires because of the wall and nothing is
         dissipated — and dissipation is precisely what goes wrong with every
         wall made of force. Measured on step 0, 15 minutes each, because step
         0 has no rules and so any structure in it is the wall's doing:

           · steered at the centre — extent collapses to 311 px, one clump.
           · steered along the inward normal, or mirrored about it — `steer`
             matches a DESIRED VELOCITY, so every bird leaving the same edge is
             handed the same heading at the same speed. Mean nearest-neighbour
             distance 21 px, and the render shows convoys of four birds.
           · a repulsive force along the normal — the force does work, the
             speed clamp truncates the excursion, that truncation is a
             dissipation, and over two minutes the birds fall into a common
             orbit and gather anyway. Rendered and looked at, not just
             measured.
           · turning only until the bird stops leaving (`into` = 0) — no
             dissipation, but a bird that leaves the wall exactly tangentially
             stays on it. After two minutes the birds are a ring round the edge
             with an empty middle.

         `into` = 0.70 is what sends them back across the stage rather than
         along the wall, and it is the number that moves step 0's mean
         nearest-neighbour distance from 24 px to the 44 px a random scatter
         over this ellipse would give. */
      if(b.turn){
        const nx = (s.x[i] - b.cx) / b.rx, ny = (s.y[i] - b.cy) / b.ry;
        if(Math.hypot(nx, ny) > b.contain){
          let ox = nx / b.rx, oy = ny / b.ry;                        // grad of the
          const om = Math.hypot(ox, oy) || 1; ox /= om; oy /= om;    //   ellipse
          const spd = Math.hypot(s.vx[i], s.vy[i]) || 1;
          if(s.vx[i] * ox + s.vy[i] * oy > -b.into * spd){           // not yet in
            const a = ((-s.vy[i] * ox + s.vx[i] * oy) > 0 ? -1 : 1) * b.turn;
            const ca = Math.cos(a), sa = Math.sin(a);
            const vx = s.vx[i] * ca - s.vy[i] * sa;
            s.vy[i]  = s.vx[i] * sa + s.vy[i] * ca;
            s.vx[i]  = vx;
          }
        }
      }
      s.x[i] += s.vx[i] * env; s.y[i] += s.vy[i] * env;
    }
  }

  /* ---- one step's trajectory ----------------------------------------------
     A flat Float32Array of frames x N x 4 (x, y, vx, vy). The envelope reaches
     0 `hold` frames before the table ends, so the flock is genuinely at rest in
     every frame the screenshot can land on. */
  function run(state, rules, frames, brakeAt, hold){
    const out = new Float32Array(frames * N * 4);
    const s = copy(state);
    const brakeSpan = Math.max(1, frames - hold - brakeAt);
    for(let f = 0; f < frames; f++){
      const env = f < brakeAt ? 1
                : f >= frames - hold ? 0
                : 1 - smoothstep((f - brakeAt) / brakeSpan);
      if(f) tick(s, rules, env);
      const o = f * N * 4;
      for(let i = 0; i < N; i++){
        out[o + i*4    ] = s.x[i];  out[o + i*4 + 1] = s.y[i];
        out[o + i*4 + 2] = s.vx[i]; out[o + i*4 + 3] = s.vy[i];
      }
    }
    return { traj: out, end: s };
  }

  /* ---- the five steps -----------------------------------------------------
     0  scattered   no rules — drift, and the edge of the world, nothing else
     1  + separation
     2  + alignment
     3  + cohesion
     4  the morph   step 3's final formation, held: same rules, same emergence,
                    different agents. One frame, no motion at all.            */
  const PLAN = [
    { id:'scattered', rules:0, frames:170, brakeAt:110, hold:26 },
    { id:'separate',  rules:1, frames:240, brakeAt:170, hold:26 },
    { id:'align',     rules:3, frames:240, brakeAt:170, hold:26 },
    { id:'cohere',    rules:7, frames:320, brakeAt:240, hold:26 }
  ];

  function build(seed){
    const steps = [];
    let s = scatter(seed === undefined ? P.seed : seed);
    for(const p of PLAN){
      const r = run(s, p.rules, p.frames, p.brakeAt, p.hold);
      steps.push({ id:p.id, frames:p.frames, traj:r.traj });
      s = r.end;
    }
    const last = steps[steps.length - 1];
    steps.push({ id:'parrots', frames:1,
                 traj: last.traj.slice((last.frames - 1) * N * 4) });
    return steps;
  }

  return { N, BOX, CRUISE, P, PLAN, build, scatter, run, tick, copy };
})();

if(typeof module !== 'undefined' && module.exports) module.exports = BOIDS;


/* ---- the stage -----------------------------------------------------------
   The kit's flat isometric grid, and nothing else on it: no terrain, no
   districts, no fog. This build is about what the agents do, so the ground is
   a stage and not an argument — `mode:'flat'` gives the pale panel grid the
   theme specimen opens on. 34 x 34 tiles at zoom 0.85 puts the diamond at
   x 324..1596, y 332..968, which clears the slide copy at the top left and the
   step counter at the bottom right.

   The flight offset is taken from the kit's own projection rather than
   guessed: LIFT is the screen distance `Landscape.project` puts between ground
   level and FLY_H voxels up, so the birds sit exactly FLY_H voxels above their
   shadows, at the grid's own vertical scale. ISO is the grid's own tile
   aspect, which is what flattens a shadow into the ground plane. */
const GRID  = { cols:34, rows:34, tile:{ w:44, h:22, z:14 }, zoom:0.85, oy:110 };
const FLY_H = 7;                              // voxel units above the ground
const ISO   = GRID.tile.h / GRID.tile.w;      // 0.5 — the ground-plane squash

const STEPS = BOIDS.build(BOIDS.P.seed);
const N     = BOIDS.N;

/* ---- the marks -----------------------------------------------------------
   One bird glyph, drawn as a polygon in the kit's own `poly()`. Deliberately
   NOT the atlas parrot: steps 0-3 are about the rules, so the agents are
   abstract, and the reveal at step 4 is that they were our agents all along.

   Local coordinates: +x is the direction of flight, +/-y the wings, one unit
   is BIRD_S stage px. A gull from above — nose, swept wings, tail — which
   gives every mark an unambiguous heading, and heading is what step 2 is
   about. */
const BIRD = [
  [ 1.15,  0.00],                       // nose
  [ 0.34,  0.15],
  [-0.30,  0.95], [-0.62,  0.90],       // right wing, swept back
  [-0.20,  0.16],
  [-1.10,  0.00],                       // tail
  [-0.20, -0.16],
  [-0.62, -0.90], [-0.30, -0.95],       // left wing
  [ 0.34, -0.15]
];
const BIRD_S = 17;        // 38 px nose to tail, 32 px span
const PAR_PX = 4.2;       // atlas parrot at 46 px — clear air at the 58 px
                          // minimum spacing the simulation is gated on

/* A silhouette rotated to `ang` and squashed by `sq` about its own centre.
   `sq < 1` lays the shape down in the ground plane: the isometric projection
   is a 45-degree rotation followed by a vertical scale of tile.h/tile.w, so a
   flat object heading in screen direction d is drawn at the pre-squash angle
   atan2(dy/ISO, dx) and then squashed. That is how the shadows are built, and
   why they foreshorten correctly as a bird turns. The bird itself is in the
   air, not lying on the ground, so it is drawn unsquashed and keeps its full
   size whichever way it is pointing. */
function silhouette(ctx, cx, cy, ang, s, sq){
  const ca = Math.cos(ang), sa = Math.sin(ang);
  poly(ctx, BIRD.map(([a, b]) => [ cx + (a*ca - b*sa) * s,
                                   cy + (a*sa + b*ca) * s * sq ]));
}

/* ---- the flock drawable --------------------------------------------------
   One scene object owning all 24 agents, built once per `build()` and given an
   absolute state by every step. Its state is (step, prog, morph, fade) plus,
   once the step has settled and the flock has taken off again, `live` — a
   simulation state of its own. `draw` is a pure function of whichever of the
   two is current: it reads no clock itself, so the same state always paints
   the same pixels, and the only thing that moves is who advances `live`. */
function makeFlock(scene, lift){
  const order = new Array(N);
  const buf = new Float32Array(N * 4);      // whichever frame is current
  const o = {
    layer:'world', z:6,
    step:0, prog:1, morph:0, morphTo:0, fade:1,
    live:null, ticks:0,

    /* the deck calls this after the settle chain; it must agree with what the
       step functions set, not fight it — hence `morphTo`. Dropping `live` is
       what makes a rewind land on the table's own last row rather than
       wherever the flock had flown to: `settleTo` runs this after the settle
       chain, and the flight loop then starts again from that row. */
    settle(){ this.prog = 1; this.fade = 1; this.morph = this.morphTo;
              this.live = null; this.ticks = 0; },

    /* Playback: prog 0..1 -> a row of this step's table. Rounding to an
       integer row is what makes progress 1 and `settle()` the same frame. */
    row(){
      const st = STEPS[this.step];
      return Math.round(this.prog * (st.frames - 1)) * N * 4;
    },

    /* THE LIVE FLIGHT. `ms` is the time since this step's flight began, so the
       flock is a function of elapsed time and not of how many frames the
       browser managed to render — except that a tab which has been asleep is
       allowed to fall behind rather than spend a second catching up, which is
       the one place this build is not reproducible from the clock alone and
       does not need to be (see "THE FLOCK NEVER LANDS"). */
    fly(rules, ms){
      if(!this.live){ this.live = BOIDS.copy(settledState(this.step)); this.ticks = 0; }
      const want = Math.min(Math.floor(ms / TICK_MS), this.ticks + CATCHUP);
      while(this.ticks < want){
        this.ticks++;
        const spool = Math.min(1, this.ticks * TICK_MS / SPOOL);
        BOIDS.tick(this.live, rules, spool * spool * (3 - 2 * spool), BOIDS.CRUISE);
      }
    },

    /* The current frame, from the live flock if it is flying and from this
       step's table if it is not. One buffer, filled in place: the draw below
       reads exactly the same four floats per bird either way. */
    frame(){
      if(this.live){
        const s = this.live;
        for(let i = 0; i < N; i++){
          buf[i*4] = s.x[i];      buf[i*4 + 1] = s.y[i];
          buf[i*4 + 2] = s.vx[i]; buf[i*4 + 3] = s.vy[i];
        }
      } else {
        const st = STEPS[this.step], r = this.row();
        buf.set(st.traj.subarray(r, r + N * 4));
      }
      return buf;
    },

    draw(ctx){
      if(this.fade <= 0.001) return;
      const t = this.frame(), r = 0;
      for(let i = 0; i < N; i++) order[i] = i;
      /* far to near, so overlaps stack the way the grid does */
      order.sort((a, b) => t[r + a*4 + 1] - t[r + b*4 + 1]);

      const m = this.morph, atlas = m > 0.002 ? getAtlas() : null;
      const fr = atlas ? atlas.frames['parrot.perch'] : null;
      const pw = fr ? fr.cols * PAR_PX : 0, ph = fr ? fr.rows * PAR_PX : 0;
      ctx.imageSmoothingEnabled = false;

      for(const i of order){
        const x = t[r + i*4], y = t[r + i*4 + 1];
        const vx = t[r + i*4 + 2], vy = t[r + i*4 + 3];

        /* the shadow, lying on the grid — it is the shadow that says where in
           the formation a bird is, and it is the same mark at every step, so
           step 4's claim that the formation is unchanged is visible on the
           ground as well as in the air. */
        ctx.globalAlpha = 0.14 * this.fade;
        ctx.fillStyle = color('ink');
        silhouette(ctx, x, y, Math.atan2(vy / ISO, vx), BIRD_S * 0.82, ISO);
        ctx.fill();

        const by = y - lift;
        if(m < 0.998){                                    // the bird
          ctx.globalAlpha = (1 - m) * this.fade;
          ctx.fillStyle = color('ink');
          silhouette(ctx, x, by, Math.atan2(vy, vx), BIRD_S, 1);
          ctx.fill();
        }
        if(m > 0.002){                                    // the deck's parrot
          ctx.globalAlpha = m * this.fade;
          const left = Math.round(x - pw/2), top = Math.round(by - ph/2);
          if(vx < 0){
            ctx.save(); ctx.translate(Math.round(x), 0); ctx.scale(-1, 1);
            ctx.drawImage(atlas.canvas, fr.x, fr.y, fr.w, fr.h,
                          Math.round(-pw/2), top, pw, ph);
            ctx.restore();
          } else {
            ctx.drawImage(atlas.canvas, fr.x, fr.y, fr.w, fr.h, left, top, pw, ph);
          }
        }
      }
      ctx.globalAlpha = 1;
    }
  };
  scene.add(o);
  return o;
}

/* ---- geometry of the settled formations ----------------------------------
   Read straight out of the trajectory tables, so the annotation marks are
   pinned to where the flock actually ends up rather than to a guess. */
function settledFrame(k){
  const st = STEPS[k], r = (st.frames - 1) * N * 4, out = [];
  for(let i = 0; i < N; i++)
    out.push({ x:st.traj[r + i*4], y:st.traj[r + i*4 + 1] });
  return out;
}
/** The same row, as a simulation state — where the live flight takes off from.
    Velocities matter here and not in `settledFrame`: the brake envelope zeroes
    the position update, not the headings, so every bird still has the heading
    it was flying on and the flock leaves from where it is pointing. */
function settledState(k){
  const st = STEPS[k], r = (st.frames - 1) * N * 4;
  const s = { x:new Float64Array(N),  y:new Float64Array(N),
              vx:new Float64Array(N), vy:new Float64Array(N) };
  for(let i = 0; i < N; i++){
    s.x[i]  = st.traj[r + i*4];     s.y[i]  = st.traj[r + i*4 + 1];
    s.vx[i] = st.traj[r + i*4 + 2]; s.vy[i] = st.traj[r + i*4 + 3];
  }
  return s;
}
/** The two birds standing closest together in step 0 — what step 1 fixes. */
function tightestPair(lift){
  const a = settledFrame(0);
  let best = null;
  for(let i = 0; i < N; i++) for(let j = i + 1; j < N; j++){
    const d = Math.hypot(a[i].x - a[j].x, a[i].y - a[j].y);
    if(!best || d < best.d) best = { d, i, j };
  }
  const p = a[best.i], q = a[best.j];
  return { x:Math.min(p.x, q.x), y:Math.min(p.y, q.y) - lift,
           w:Math.abs(p.x - q.x), h:Math.abs(p.y - q.y) };
}
/** The whole flock, once cohesion has gathered it. */
function flockBox(k, lift){
  const a = settledFrame(k);
  const xs = a.map(p => p.x), ys = a.map(p => p.y - lift);
  return { x:Math.min(...xs), y:Math.min(...ys),
           w:Math.max(...xs) - Math.min(...xs), h:Math.max(...ys) - Math.min(...ys) };
}

/* ---- placing the annotations ---------------------------------------------
   BOTH captions are positioned by collision test rather than by eye. Every
   bird on this slide is at a position that is a pure function of the seed, so
   "does this caption sit on a bird" is arithmetic, and `sweep` does the
   arithmetic: 24 directions around the mark being annotated, a handful of
   standoffs on each, and the cheapest candidate that clears the agents, the
   edge of the grid and the deck's DOM chrome wins.

   WHY STEPS 3-4 POINTED RATHER THAN ENCIRCLED — history now, since the
   pointer itself was removed on 6 September 2026, but it is why `placePointer`
   exists at all and why nobody should replace it with a ring. The birds fly
   LIFT px above their
   shadows, so the settled flock's screen box — 444 x 349, centred at
   (1019, 526) — rides high on the stage, while the grid projects to a
   1272 x 636 diamond centred at (960, 650). Write that diamond as
   |u| + |v| <= 1 with u = (x-960)/636 and v = (y-650)/318; an ellipse drawn
   round the flock stays inside it only if |u0| + |v0| + hypot(a, b) <= 1, and
   the numbers are 0.09 + 0.39 + 0.78 = 1.26. No ring both contains this flock
   and stays on this grid — the one that used to be here left the stage over
   the top vertex and again past the upper-right edge, and read as floating in
   the background rather than drawn on the ground. So the flock is pointed at
   instead, using the kit's other pointing primitive: `Annotate.arrow` (R6), a
   leader run from the caption to the flock's near edge. A leader is a short
   segment, so it fits on the diamond by construction, and it is checked
   against every agent before it is accepted. Step 0 keeps its ring: the pair
   it circles is 26 px across, and a ring that small sits well inside the grid.

   Placement is computed in `build()`, from the trajectory tables and the kit's
   own projection and nothing else, so the mount pass and the rewind pass agree
   to the last float — which is what --rewind-check compares. */

/* Caption metrics without measuring a font. `--sk-annot` is the theme's own
   size; `--sk-font-annot` is a monospace stack, and every face in it advances
   0.6 em, so a caption's width is length x size x 0.6. That keeps the number
   identical on the mount pass (where a webfont may still be decoding) and on
   the rewind pass, and no font is named here. */
const ANNOT_PX = parseFloat(cssVar('--sk-annot', '32px'));
const ADV      = 0.6;
const CAP_PAD  = 7;                    // breathing room baked into the test
/* One disc per agent, sized for whichever mark is on the stage: the gull is
   39 px nose to tail and 32 px across, the atlas parrot 46 px square. */
const MARK_R   = 24;
/* The DOM chrome, from the kit's own defaults — `slideCopy` lays out at
   (120, 96) over 1100 px, and `.sk-counter` is pinned 34/26 px off the bottom
   right. A canvas caption may not sit under either. */
const CHROME   = [ { x:100, y:76, w:1140, h:230 },
                   { x:1440, y:952, w:480, h:128 } ];
const DIRS     = Array.from({ length:24 }, (_, i) => i / 24 * Math.PI * 2);

function capRect(pos, text, align){
  const w = text.length * ANNOT_PX * ADV;
  const x = align === 'right' ? pos[0] - w : align === 'center' ? pos[0] - w/2 : pos[0];
  return { x:x - CAP_PAD, y:pos[1] - ANNOT_PX * 0.80 - CAP_PAD,
           w:w + CAP_PAD * 2, h:ANNOT_PX * 1.04 + CAP_PAD * 2 };
}
/* The grid's projected quad, taken from `land.project` rather than guessed, so
   "on the stage" means the stage the kit actually drew. */
function quadOf(land){
  const t = land.project(0, 0, 0), b = land.project(GRID.cols, GRID.rows, 0);
  const l = land.project(0, GRID.rows, 0), r = land.project(GRID.cols, 0, 0);
  return { cx:(l[0] + r[0]) / 2, cy:(t[1] + b[1]) / 2,
           hw:(r[0] - l[0]) / 2,  hh:(b[1] - t[1]) / 2 };
}
const onQuad = (q, x, y, m) =>
  Math.abs(x - q.cx) / q.hw + Math.abs(y - q.cy) / q.hh <= 1 - m;
const rectOnQuad = (q, r, m) =>
  onQuad(q, r.x, r.y, m) && onQuad(q, r.x + r.w, r.y, m) &&
  onQuad(q, r.x, r.y + r.h, m) && onQuad(q, r.x + r.w, r.y + r.h, m);

function discRect(d, r, pad){
  const nx = Math.max(r.x, Math.min(d.x, r.x + r.w));
  const ny = Math.max(r.y, Math.min(d.y, r.y + r.h));
  return Math.hypot(d.x - nx, d.y - ny) < d.r + pad;
}
function discSeg(d, x0, y0, x1, y1, pad){
  const dx = x1 - x0, dy = y1 - y0, L2 = dx*dx + dy*dy || 1;
  const t = Math.max(0, Math.min(1, ((d.x - x0)*dx + (d.y - y0)*dy) / L2));
  return Math.hypot(d.x - (x0 + dx*t), d.y - (y0 + dy*t)) < d.r + pad;
}
/* The same quadratic the kit's `_arrow` draws, so the path that is tested is
   the path that appears. */
function arrowPath(from, to, curve, n){
  const mx = (from[0] + to[0]) / 2, my = (from[1] + to[1]) / 2;
  const dx = to[0] - from[0], dy = to[1] - from[1];
  const cx = mx - dy * curve, cy = my + dx * curve, out = [];
  for(let i = 0; i <= n; i++){
    const t = i / n, u = 1 - t;
    out.push([ u*u*from[0] + 2*u*t*cx + t*t*to[0],
               u*u*from[1] + 2*u*t*cy + t*t*to[1] ]);
  }
  return out;
}
/** The agents of step k as obstacle discs — in the air, or their shadows. */
function agents(k, lift, ground){
  return settledFrame(k).map(p => ({ x:p.x, y:ground ? p.y : p.y - lift,
                                     r:ground ? MARK_R * 0.82 : MARK_R }));
}

/* The sweep. `check` returns false to veto a candidate, or a cost to add. */
function sweep(q, text, target, hard, soft, o, check){
  const cx = target.x + target.w/2, cy = target.y + target.h/2;
  const rx = target.w/2, ry = target.h/2;
  let best = null;
  for(const a of DIRS) for(const s of o.steps){
    const ca = Math.cos(a), sa = Math.sin(a), d = o.gap + s;
    const ax = cx + ca * (rx + d), ay = cy + sa * (ry + d);
    const align = ca < -0.25 ? 'right' : ca > 0.25 ? 'left' : 'center';
    const pos = [ax, ay + ANNOT_PX * 0.30];      // optical centre on the ray
    const rect = capRect(pos, text, align);
    if(!rectOnQuad(q, rect, o.margin)) continue;
    if(CHROME.some(k => !(rect.x > k.x + k.w || rect.x + rect.w < k.x ||
                          rect.y > k.y + k.h || rect.y + rect.h < k.y))) continue;
    if(hard.some(dd => discRect(dd, rect, o.clear))) continue;
    const inx = ca < 0 ? rect.x + rect.w : ca > 0 ? rect.x : rect.x + rect.w/2;
    const cand = { pos, align, rect, a, d, inx, iny:ay, ca, sa, cx, cy, rx, ry };
    const extra = check(cand);
    if(extra === false) continue;
    /* shadows are ink at 0.14 alpha: worth stepping around, not worth failing
       a candidate over. Level captions read better than stacked ones, and a
       caption near its mark reads better than one adrift. */
    const dim = soft.filter(dd => discRect(dd, rect, 0)).length;
    cand.score = extra + dim * 40 + Math.abs(sa) * 32 + d * 0.55;
    if(!best || cand.score < best.score) best = cand;
  }
  return best;
}
/** A caption beside a mark: its sight line to the mark must not cross an agent. */
function placeCaption(q, text, target, hard, sight, soft, o){
  return sweep(q, text, target, hard, soft, o, c => {
    const ex = c.cx + c.ca * (c.rx + o.edge), ey = c.cy + c.sa * (c.ry + o.edge);
    return sight.some(dd => discSeg(dd, c.inx, c.iny, ex, ey, 0)) ? 70 : 0;
  });
}
/** A caption plus a leader arrow: the whole leader is tested, not just the text. */
function placePointer(q, text, target, hard, soft, o){
  return sweep(q, text, target, hard, soft, o, c => {
    const ux = c.cx - c.inx, uy = c.cy - c.iny, L = Math.hypot(ux, uy) || 1;
    const from = [c.inx + ux/L * o.tail, c.iny + uy/L * o.tail];
    /* Aim at the flock's centre and stop at its edge: march until the first
       agent is within reach, and put the head there. */
    let tip = [c.cx, c.cy];
    for(let t = 0; t <= L; t += 2){
      const px = from[0] + ux/L * t, py = from[1] + uy/L * t;
      if(hard.some(dd => Math.hypot(dd.x - px, dd.y - py) < dd.r + o.tip)){
        tip = [px, py]; break;
      }
    }
    const len = Math.hypot(tip[0] - from[0], tip[1] - from[1]);
    if(len < o.want * 0.45) return false;        // too stubby to read as a leader
    const pts = arrowPath(from, tip, o.curve, 24);
    for(let i = 0; i < pts.length - 1; i++){
      if(!onQuad(q, pts[i][0], pts[i][1], o.margin)) return false;
      for(const dd of hard)
        if(discSeg(dd, pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1], 4)) return false;
    }
    c.from = from; c.tip = tip;
    return Math.abs(len - o.want) * 0.9;
  });
}

const RING0 = 30;                     // pad on step 0's ring, in `ann.circle`
const CURVE = 0.10;                   // leader bow, passed to `ann.arrow`

function placements(land, lift){
  const q = quadOf(land);

  /* Step 0 — the ring is the pointer, so the caption only has to sit beside it
     with a clear line to it. The ring itself is an obstacle for the text, and
     the two birds inside it are excluded from the sight line: they are what is
     being pointed at, not something in the way. */
  const pair = tightestPair(lift);
  const ring = { x:pair.x + pair.w/2, y:pair.y + pair.h/2,
                 r:Math.max(pair.w, pair.h) / 2 + RING0 + 6 };
  const air0 = agents(0, lift, false);
  const cap0 = placeCaption(q, 'too close', pair,
                            air0.concat([ring]),
                            air0.filter(b => Math.hypot(b.x - ring.x, b.y - ring.y) >= ring.r),
                            agents(0, lift, true),
                            { gap:RING0 + 16, steps:[0, 20, 40, 60, 80], clear:14,
                              margin:0.02, edge:RING0 });

  /* THE SECOND MARK IS GONE. Steps 3-4 used to share one pointer — a leader
     from the caption 'one flock' to the near edge of the settled flock, solved
     here by `placePointer` and drawn by `stepFn` under `if(k >= 3)`. Both were
     removed on 6 September 2026 at the presenter's request ("remove 'one
     flock' arrow on rule three slide"), label and arrow together; the slide
     copy on step 3 already says "and it is a flock", which is the same
     sentence twice.

     `placePointer` and `flockBox` are left standing and are still correct for
     the frame they were written for. But a restored pointer would now have a
     second problem this one never had: the flock is flying from the moment
     the step's playback ends (see "THE FLOCK NEVER LANDS"), so a leader
     solved against the settled formation would within a second or two be
     aimed at empty grid. Restoring it means either fading it out as the flock
     sets off, the way step 0's ring is handled, or re-solving it every
     frame. */
  return { pair, cap0 };
}

/* ---- build ---------------------------------------------------------------
   Re-run on every rewind, so everything with state is created here. */
function build(scene){
  const land = new Landscape({ scene, cols:GRID.cols, rows:GRID.rows, tile:GRID.tile,
                               mode:'flat', camera:{ zoom:GRID.zoom, oy:GRID.oy } });
  const lift = land.project(0, 0, 0)[1] - land.project(0, 0, FLY_H)[1];
  /* `live` is the one piece of state that has to outlive a `_ctx` copy: the
     deck hands every step function a fresh object built with
     Object.assign({}, ctxBase, …), so a field written on `c` is thrown away,
     but a field written INSIDE an object that came from here is shared by
     every step of this build. That is where the flight loop's handle lives,
     so each step can stop the previous step's loop before starting its own —
     including down a `settleTo` chain, which runs settle() for every step up
     to the target and would otherwise leave four loops running at once. */
  return { scene, land, lift,
           flock: makeFlock(scene, lift),
           mark:  placements(land, lift),
           live:  { h:null, marks:[] },
           ann:   new Annotate({ scene }) };
}

/* ---- one step ------------------------------------------------------------
   The kit's contract: one function per step taking `ms`, called with a
   duration from `enter` and with 0 from `settle`.

   `ann.seed` is reset explicitly, and that is a bug fix, not a flourish.
   `Annotate` draws each mark's wobble from a seed it increments per mark and
   never resets — not even on `clear()` — so the same mark would get a
   different seed depending on how many marks the deck had drawn on the way to
   this step. Forward (enter after enter) and rewound (settle chain) reach a
   step having drawn different numbers of marks, so the wobble would differ and
   the rewind check would show a diff on the annotation layer. Pinning the seed
   per step makes every mark identical on every route to it. */
function markSeed(c, k){ c.ann.clear(); c.ann.seed = 40 + k * 10; }

/* `afterFlock` used to live here — a mark wound back and tweened on with a
   delay, so it arrived after the flock had finished moving. It went on
   6 September 2026 with the wait it existed to sit behind: step 0 no longer
   has a playback for a mark to wait out, and `Annotate`'s own `ms` draws the
   ring on perfectly well from the first frame. */

/* COPY[0] WAS 'Twenty-four birds, no plan.' over 'Each one moves on its own.
   Some of them are crowding.' Both were replaced on 6 September 2026 at the
   presenter's request, verbatim: "first slide, remove subtitle, set title
   'Bird flocking is an example of emergent coordination'". His capitalisation
   and his lack of a full stop are kept as written — note that the other three
   titles are sentences and end in one, so step 1 is now the odd one out; that
   is his call to make, not this file's. The empty second string is not a
   placeholder: `slideCopy` omits the <p class="sk-body"> entirely when body is
   falsy, so the step really has no subtitle element at all. */
const COPY = [
  ['Bird flocking is an example of emergent coordination',
   ''],
  ['Rule one: don&rsquo;t crowd.',
   'Steer away from any neighbour that gets too close.'],
  ['Rule two: match your neighbours.',
   'Steer towards the average heading of the birds nearby.'],
  ['Rule three: stay with them.',
   'Steer towards their average position. Three local rules, and it is a flock.'],
  ['Same rules. Different birds.',
   'Nobody chose the formation. It is only what the three rules do.']
];

/* ---- the live flight -----------------------------------------------------
   THE FLOCK NEVER LANDS. Added 6 September 2026 at the presenter's request
   ("make the animations loop"), and retimed the same day after he watched it:
   "the flock slides now wait for ages before starting on each slide". There
   is now NO WAIT ANYWHERE. Steps 1-3 still open on the scripted trajectory
   out of boids.js — the rule arriving and the flock answering is the point of
   the step — and the live simulation takes over from the table's last row the
   instant that playback ends, spooling up over SPOOL and no longer. Step 0
   has no formation to animate into, so it has no playback at all: the flock
   is flying from the first frame it is visible, under the layer fade-in.
   `settle()` — the goto and rewind path — starts the flight immediately too,
   from the settled row, so stepping back and forward never shows a frozen
   flock either.

   IT IS THE KIT'S OWN IN-STEP LOOP. `ctx.autoplayWithin(fn, 0)` is
   `loopEvery`, which the deck registers in `deck.loops` and stops on every
   step change and every rebuild, and which under `motion.reduced` calls its
   function exactly once and never subscribes to the ticker. So: reduced
   motion gets the still settled frame it always got, and nothing keeps
   running behind a step the audience has left. `ms:0` means "every animation
   frame", which is what a simulation wants; the flock advances at TICK_MS,
   not at the frame rate, so the pace is the same on any display.

   HOW A CAPTURE STILL GETS A DETERMINISTIC FRAME — the hook, not a hold. A
   live flock cannot be photographed twice identically at two independently
   timed instants, and this build's whole verification story is that
   tools/smoke.js can screenshot a step going forward and again coming back
   and compare the two. It used to buy that with a delay before take-off, and
   the delay was long enough to see. So the build exposes two methods on
   `window.deck` instead:

     deck.freezeForCapture()   stop every in-step loop and put the step back
                               on its canonical settled frame — the last row
                               of its table, which is exactly what `settle()`
                               draws — and leave it there.
     deck.resumeAfterCapture() let it fly again, from that settled row.

   Both are one call to the deck's own `settleTo(index)`, which is the
   deterministic jump the rewind check already relies on, so "frozen" and
   "rewound" are the same code path and cannot drift apart. A `frozen` flag
   keeps `flightLoop` from starting a loop in between.

   THE CONTRACT WITH tools/smoke.js IS NOW THIS HOOK AND NOTHING ELSE. It
   calls `window.deck.freezeForCapture?.()` immediately before every
   screenshot and `resumeAfterCapture?.()` immediately after, on the forward
   pass and the rewind pass alike; builds without the methods are unaffected.
   No timing constant in this file is coupled to any timing constant in that
   one any more. The same courtesy reaches tools/deckshot.js, which drives
   this build through the iframe bridge, as an `sk-freeze` message the bridge
   in assemble.js turns into the same two calls.

   THEME §4 SAYS NO INFINITE LOOPS, and this is one. It is recorded as a
   deviation made at the presenter's explicit instruction, not as an oversight
   — and it is the subject of the slide rather than decoration on it: the
   claim being made is that a flock is what three local rules do, and a flock
   that is frozen is a diagram of that claim rather than the thing itself. */
const TICK_MS = 1000 / 60;     // simulation ticks: 60/s, ~90 px/s top speed
const SPOOL   = 250;           // ms of eased take-off, so nothing snaps
const CATCHUP = 6;             // max ticks per frame — a slept tab falls behind
                               //   rather than spending a second catching up
/* Step 0's ring and its caption: drawn on over MARK_IN, held, and then gone
   with the birds. It says "these two are too close", which stops being true
   within about a second of the flock setting off — there are no rules on step
   0 to hold that pair together — so the mark is a beat at the top of the step
   and not a label that sits there. `Mark.opacity` is a plain field on the
   kit's mark, so the fade is one assignment per frame with no tween to keep
   in step with the deck's group. Steps 1-3 pass an empty list: since the 'one
   flock' pointer was removed there is nothing else on the canvas to take. */
const MARK_IN   = 420;
const MARK_HOLD = 1100;
const MARK_OUT  = 600;

/* Set while a capture is in progress. It is deliberately module-level rather
   than per-build: `freezeForCapture` goes through `settleTo`, which rebuilds
   the scene and hands `flightLoop` a brand-new context, and the flag has to
   survive that. */
const CAPTURE = { frozen:false };

/* `after` is how long this step's own entry animation runs — MS for steps 1-3
   entered forwards, 0 for step 0 and for every settle. It is not a delay
   chosen for a harness; it is the length of the thing already on screen. */
function flightLoop(c, k, marks, after){
  const live = c.live;
  if(live.h){ live.h.stop(); live.h = null; }
  live.marks = marks;
  if(motion.reduced || CAPTURE.frozen) return;
  const t0 = performance.now();
  const rules = BOIDS.PLAN[k].rules;
  live.h = c.autoplayWithin(() => {
    const since = performance.now() - t0;
    if(since >= after) c.flock.fly(rules, since - after);
    if(live.marks.length){
      const a = since <= MARK_HOLD ? 1
              : Math.max(0, 1 - (since - MARK_HOLD) / MARK_OUT);
      for(const m of live.marks) m.opacity = a;
    }
  }, 0);
}

function stepFn(c, k, ms){
  c.scene.clearOverlays();
  markSeed(c, k);

  const f = c.flock;
  f.step = k; f.morphTo = k === 4 ? 1 : 0;
  /* Drop the previous step's live flock. Every step is entered with the deck
     having just settled the one before it, and that one may have been in the
     air; without this the new step would draw the old step's flying positions
     instead of its own table. */
  f.live = null; f.ticks = 0;

  if(!ms){                                   /* settle: absolute, no animation */
    f.prog = 1; f.morph = f.morphTo; f.fade = 1;
  } else if(k === 4){
    /* the payload. The formation does not move at all — step 4's table is step
       3's last row — so the only thing that changes is what the agents are. */
    f.prog = 1; f.fade = 1; f.morph = 0;
    tween({ from:0, to:1, ms, ease:ease.inOutCubic, group:c.group,
            onUpdate:v => f.morph = v });
  } else if(k === 0){
    /* No rule arrives on step 0 and there is no formation to animate into, so
       there is no playback either: the flock starts on its settled row and is
       already flying under the fade-in. This is what "the birds should be
       flying from the moment the step is visible" means in code. */
    f.prog = 1; f.morph = 0; f.fade = 0;
    tween({ from:0, to:1, ms:DUR.normal, group:c.group,
            onUpdate:v => f.fade = v });
  } else {
    f.prog = 0; f.morph = 0; f.fade = 1;
    tween({ from:0, to:1, ms, ease:ease.linear, group:c.group,
            onUpdate:v => f.prog = v });
  }

  /* ONE marked step in the whole sequence, carrying that step's own claim: a
     ring round the crowded pair, positioned in `build()` by collision test —
     see "placing the annotations". Step 3's 'one flock' pointer was removed on
     6 September 2026 at the presenter's request; steps 1 and 2 were always
     unmarked on purpose, because the spacing and the headings are the change
     and a mark on them would only repeat the slide copy. */
  const marks = [];
  if(k === 0){
    const { pair, cap0 } = c.mark;
    const draw = ms ? MARK_IN : 0;
    marks.push(c.ann.circle(pair, { ms:draw, pad:RING0 }));
    marks.push(c.ann.label(cap0.pos, 'too close',
                           { ms:draw, align:cap0.align }));
  }

  slideCopy(c.scene, { display: COPY[k][0], body: COPY[k][1] });
  flightLoop(c, k, marks, ms && k > 0 ? ms : 0);
}

/* ---- the deck ------------------------------------------------------------
   Steps 1-3: 1700 ms of flock as the rule takes hold, and then the live
   flight, straight off the table's last row. The table brakes to a stop over
   its own last 80 frames and holds the final 26, so the hand-over is from a
   standstill and the flock sets off again rather than changing gear — which
   is why SPOOL is 250 ms and not longer. Step 0 has no playback at all: the
   flock is flying under the fade-in from the first frame.

   THERE IS NO LONGER A `MS0`, AND NO `WAKE`. Both existed to keep a still
   frame under the shutter of tools/smoke.js at a known instant — MS0 so
   step 0's opening finished inside the 1200 ms smoke waits after `load`, WAKE
   so the flock had not taken off by the time the screenshot was taken. The
   presenter watched the result and said "the flock slides now wait for ages
   before starting on each slide", which was fair: WAKE was 3000 ms. The
   determinism they were buying is bought by `deck.freezeForCapture()` instead
   — see "THE FLOCK NEVER LANDS" — and this file has no timing constant tied
   to a harness any more. */
const MS  = 1700;
/* 'parrots' was the fifth id; the step was cut 5 Sep 2026 at the author's
   request, and restoring it is putting the string back on the end of this line
   (nothing else was deleted — `stepFn`'s k === 4 branches and COPY[4] are
   still here, and the manifest's declared step count goes back to 5). */
const IDS = ['scattered', 'separation', 'alignment', 'cohesion'];

const { deck } = boot({
  el: '#stage',
  build,
  steps: IDS.map((id, k) => ({
    id, label:'The flock',
    enter:  c => stepFn(c, k, MS),
    settle: c => stepFn(c, k, 0)
  }))
});

/* ---- the capture hook ----------------------------------------------------
   The contract with tools/smoke.js, and through the bridge in assemble.js
   with tools/deckshot.js. `settleTo(index)` is the deck's own deterministic
   jump — fresh build, then `settle()` for every step up to this one — so the
   frame a capture gets is the same frame the rewind check gets, by
   construction rather than by agreement. The flag is what stops the settle
   chain starting a flight loop on the way past.

   Both are idempotent and safe to call on any step, including step 0, and
   safe to call when nothing is flying. */
deck.freezeForCapture = function(){
  CAPTURE.frozen = true;
  this.settleTo(this.index);
  return true;
};
deck.resumeAfterCapture = function(){
  CAPTURE.frozen = false;
  this.settleTo(this.index);
  return true;
};
window.deck = deck;
</script>
<script>
(function(){
  const send = () => { try { parent.postMessage({ type:'sk-state', index: deck.index,
    count: deck.steps.length, atStart: deck.index===0, atEnd: deck.index===deck.steps.length-1 }, '*'); } catch(e){} };
  addEventListener('message', e => { const m = e.data || {};
    if (m.type === 'sk-step') { m.dir > 0 ? deck.next() : deck.prev(); setTimeout(send, 80); }
    if (m.type === 'sk-goto') { deck.goTo(m.index, { animate:false }); setTimeout(send, 80); }
    if (m.type === 'sk-freeze') { try {
      m.on ? deck.freezeForCapture && deck.freezeForCapture()
           : deck.resumeAfterCapture && deck.resumeAfterCapture(); } catch(err){} }
    if (m.type === 'sk-query') send(); });
  send();
})();
</script>
</body></html>
