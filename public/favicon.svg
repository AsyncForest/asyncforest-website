<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 34">
  <style>
    .b1 { fill: #234a8f; }
    .b2 { fill: #1b3c76; }
    .b3 { fill: #142c58; }
    .bt { fill: #cdd9ee; }
    @media (prefers-color-scheme: dark) {
      .b1, .b2, .b3 { fill: #f4f6fb; }
      .bt { fill: #52565e; }
    }
  </style>
  <defs>
    <clipPath id="clip">
      <path d="M17 2.5 L29.5 30 L4.5 30 Z"/>
      <rect x="15.6" y="30" width="2.8" height="3.2"/>
    </clipPath>
    <mask id="knock" maskUnits="userSpaceOnUse" x="0" y="0" width="38" height="34">
      <rect width="38" height="34" fill="#fff"/>
      <path d="M17 2.5 L29.5 30 L4.5 30 Z" fill="#000" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
      <rect x="15.6" y="30" width="2.8" height="3.2" fill="#000" stroke="#000" stroke-width="2.4"/>
    </mask>
    <pattern id="hatch" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="b1" width="1.05" height="2.4"/>
    </pattern>
    <pattern id="px" width="3.2" height="3.2" patternUnits="userSpaceOnUse">
      <rect class="b2" x="0" y="0" width="1.6" height="1.6"/>
      <rect class="b2" x="1.6" y="1.6" width="1.6" height="1.6"/>
    </pattern>
  </defs>
  <path class="bt" d="M21 1 L33.5 28.5 L8.5 28.5 Z" mask="url(#knock)"/>
  <g clip-path="url(#clip)">
    <rect x="0" y="2.5" width="38" height="9.1" fill="url(#hatch)"/>
    <rect x="0" y="11.6" width="38" height="9.3" fill="url(#px)"/>
    <rect class="b3" x="0" y="20.9" width="38" height="12.3"/>
  </g>
</svg>
